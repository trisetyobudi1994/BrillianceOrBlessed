name: Generate Android Keystore

on:
  workflow_dispatch: # Memungkinkan kamu menjalankan workflow ini secara manual dari browser

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      # 1. Buat file Keystore dengan Keytool di server GitHub
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore brilliance-release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias brilliance_key \
            -storepass "KunciRahasiaGame123!" \
            -keypass "KunciRahasiaGame123!" \
            -dname "CN=Brilliance App, OU=Development, O=Brilliance, L=Jakarta, C=ID"

      # 2. Upload file Keystore sebagai Artifact (bisa didownload)
      - name: Upload Keystore File
        uses: actions/upload-artifact@v4
        with:
          name: brilliance-release-keystore
          path: brilliance-release.jks

      # 3. Konversi ke Base64 dan tampilkan di Log (untuk dimasukkan ke GitHub Secrets)
      - name: Output Base64 String
        run: |
          echo "=== SALIN KODE BASE64 DI BAWAH INI ==="
          base64 -w 0 brilliance-release.jks
          echo ""
          echo "======================================"
