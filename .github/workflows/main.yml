name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Setup Java JDK 17 (Wajib untuk Capacitor)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Prepare Client, Package.json, & Capacitor
      - name: Install Dependencies & Prepare Capacitor
        run: |
          cd BrillianceOrBlessed/client
          
          # Buat package.json darurat jika tidak ada
          if [ ! -f package.json ]; then
            echo '{"name": "brilliance-client", "version": "1.0.0"}' > package.json
          fi

          # Buat folder www & autodetect index.html
          mkdir -p www
          find . -maxdepth 3 -iname "index.html" -not -path "./www/*" -exec cp {} www/index.html \;

          # Install & Inisialisasi Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BrillianceOrBlessed" "com.brilliance.app" --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Fix Deprecated Jetifier Properties
      - name: Fix gradle.properties
        run: |
          PROPERTIES_FILE="BrillianceOrBlessed/client/android/gradle.properties"
          if [ -f "$PROPERTIES_FILE" ]; then
            sed -i 's/android.jetifier.blacklist/android.jetifier.ignorelist/g' "$PROPERTIES_FILE"
          fi

      # 6. MENCEGAH ERROR JAR: Hapus Cache Gradle yang Korup
      - name: Clean Corrupted Gradle Caches
        run: rm -rf ~/.gradle/caches/

      # 7. Build APK Debug dengan Parameter Aman
      - name: Build APK with Gradle
        run: |
          cd BrillianceOrBlessed/client/android
          chmod +x gradlew
          # Menambahkan --no-parallel dan --no-build-cache agar proses download library tidak bentrok
          ./gradlew assembleDebug --no-daemon --no-parallel --no-build-cache

      # 8. Upload hasil APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: BrillianceOrBlessed/client/android/app/build/outputs/apk/debug/app-debug.apk
