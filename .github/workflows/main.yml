name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Setup Java JDK
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Prepare Client, Package.json, & Capacitor
      - name: Install Dependencies & Prepare Capacitor
        run: |
          cd BrillianceOrBlessed/client
          
          # Buat package.json jika belum ada agar Capacitor tidak error
          if [ ! -f package.json ]; then
            echo '{"name": "brilliance-client", "version": "1.0.0"}' > package.json
          fi

          # Buat folder www dan cari file index.html
          mkdir -p www
          find . -maxdepth 3 -iname "index.html" -not -path "./www/*" -exec cp {} www/index.html \;

          # Install Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Inisialisasi & Sync Capacitor
          npx cap init "BrillianceOrBlessed" "com.brilliance.app" --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Build APK Debug dengan Gradle
      - name: Build APK with Gradle
        run: |
          cd BrillianceOrBlessed/client/android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. Upload hasil APK ke GitHub Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: BrillianceOrBlessed/client/android/app/build/outputs/apk/debug/app-debug.apk
