name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Node 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 21 (Diperlukan oleh Android Gradle Plugin & Capacitor terbaru)
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Prepare Client, Package.json, & Capacitor
      - name: Install Dependencies & Prepare Capacitor
        run: |
          cd BrillianceOrBlessed/client
          
          if [ ! -f package.json ]; then
            echo '{"name": "brilliance-client", "version": "1.0.0"}' > package.json
          fi

          mkdir -p www
          find . -maxdepth 3 -iname "index.html" -not -path "./www/*" -exec cp {} www/index.html \;

          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BrillianceOrBlessed" "com.brilliance.app" --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Fix Jetifier & Eliminasi Bentrok Duplicate Class Kotlin
      - name: Apply Gradle & Kotlin Fixes
        run: |
          cd BrillianceOrBlessed/client/android
          
          # Fix properti Jetifier usang
          if [ -f "gradle.properties" ]; then
            sed -i 's/android.jetifier.blacklist/android.jetifier.ignorelist/g' gradle.properties
          fi

          # Tambahkan aturan resolusi konflik Kotlin stdlib ke app/build.gradle
          echo '
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          ' >> app/build.gradle

      # 6. Build APK Debug
      - name: Build APK with Gradle
        run: |
          cd BrillianceOrBlessed/client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 7. Upload hasil APK ke GitHub Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: BrillianceOrBlessed/client/android/app/build/outputs/apk/debug/app-debug.apk
