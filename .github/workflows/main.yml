name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Node 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 21 (Sesuai kebutuhan Capacitor Android terbaru)
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 4. Prepare Client, Package.json, Web Assets & Capacitor
      - name: Install Dependencies & Prepare Capacitor
        run: |
          cd BrillianceOrBlessed/client
          
          # Buat package.json jika belum ada
          if [ ! -f package.json ]; then
            echo '{"name": "brilliance-client", "version": "1.0.0"}' > package.json
          fi

          # Buat direktori www dan salin index.html secara eksplisit
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            find . -maxdepth 3 -iname "index.html" -not -path "./www/*" -exec cp {} www/index.html \;
          fi

          # Install Capacitor CLI & Core
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Inisialisasi & Tambah Platform Android
          npx cap init "BrillianceOrBlessed" "com.brilliance.app" --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Fix Compatibility (Java 17 Target & Kotlin Duplicate Classes)
      - name: Apply Compatibility & Gradle Fixes
        run: |
          cd BrillianceOrBlessed/client/android

          # Ubah URL gradle wrapper ke versi -bin yang stabil agar tidak HTTP 500
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/-all.zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi

          # Paksa JavaVersion di build.gradle menggunakan Java 17
          find . -name "build.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} +
          find . -name "build.gradle" -exec sed -i 's/VERSION_21/VERSION_17/g' {} +

          # Eliminasi bentrok Duplicate Class Kotlin (Solusi Error Terakhir)
          echo '
          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
          }
          ' >> app/build.gradle

      # 6. Build APK Debug dengan Gradle Wrapper
      - name: Build APK with Gradle
        run: |
          cd BrillianceOrBlessed/client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 7. Upload hasil APK ke GitHub Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrillianceOrBlessed-APK
          path: BrillianceOrBlessed/client/android/app/build/outputs/apk/debug/app-debug.apk
