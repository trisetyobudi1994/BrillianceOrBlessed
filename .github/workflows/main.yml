name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Prepare Client, Package.json, & Capacitor
      - name: Install Dependencies & Prepare Capacitor
        run: |
          cd BrillianceOrBlessed/client

          if [ ! -f package.json ]; then
            echo '{"name": "brilliance-client", "version": "1.0.0"}' > package.json
          fi

          mkdir -p www
          find . -maxdepth 3 -iname "index.html" -not -path "./www/*" -exec cp {} www/index.html \;

          npm install @capacitor/core @capacitor/cli @capacitor/android

          npx cap init "BrillianceOrBlessed" "com.brilliance.app" --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Konfigurasi Gradle (Blacklist Jetifier + Upgrade Gradle ke 8.11.1)
      - name: Configure Gradle Properties
        run: |
          cd BrillianceOrBlessed/client/android

          # 5a. Blacklist Jetifier untuk Bouncy Castle
          echo "" >> gradle.properties
          echo "# Fix untuk bcprov-jdk18on error" >> gradle.properties
          echo "android.jetifier.blacklist=bcprov-jdk18on" >> gradle.properties
          echo "android.jetifier.ignorelist=bcprov-jdk18on" >> gradle.properties

          # 5b. Upgrade Gradle ke 8.11.1
          sed -i 's|gradle-.*-all.zip|gradle-8.11.1-all.zip|' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-.*-bin.zip|gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties

          echo "=== gradle.properties ==="
          cat gradle.properties
          echo ""
          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties

      # 6. Clean & Build APK Debug
      - name: Clean Gradle Cache
        run: rm -rf ~/.gradle/caches/

      - name: Build APK with Gradle
        run: |
          cd BrillianceOrBlessed/client/android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # 7. Upload hasil APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: BrillianceOrBlessed/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
