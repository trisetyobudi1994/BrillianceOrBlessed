name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Node 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 17 (Paling stabil & kompatibel dengan Gradle/Capacitor)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Prepare Client, Package.json, Web Assets & Capacitor
      - name: Install Dependencies & Prepare Capacitor
        run: |
          cd BrillianceOrBlessed/client
          
          # Buat package.json jika belum ada
          if [ ! -f package.json ]; then
            echo '{"name": "brilliance-client", "version": "1.0.0"}' > package.json
          fi

          # Buat direktori www dan salin index.html secara eksplisit
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            find . -maxdepth 3 -iname "index.html" -not -path "./www/*" -exec cp {} www/index.html \;
          fi

          # Install Capacitor CLI & Core
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Inisialisasi & Tambah Platform Android
          npx cap init "BrillianceOrBlessed" "com.brilliance.app" --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Fix Jetifier & Patch Gradle
      - name: Apply Gradle & Kotlin Fixes
        run: |
          cd BrillianceOrBlessed/client/android
          
          # Fix properti Jetifier usang jika ada
          if [ -f "gradle.properties" ]; then
            sed -i 's/android.jetifier.blacklist/android.jetifier.ignorelist/g' gradle.properties
          fi

          # Ubah URL gradle wrapper ke versi -bin yang stabil agar tidak HTTP 500
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/-all.zip/-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi

      # 6. Build APK Debug dengan Gradle Wrapper
      - name: Build APK with Gradle
        run: |
          cd BrillianceOrBlessed/client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 7. Upload hasil APK ke GitHub Actions Artifacts
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrillianceOrBlessed-APK
          path: BrillianceOrBlessed/client/android/app/build/outputs/apk/debug/app-debug.apk
