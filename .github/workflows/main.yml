name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Setup Java JDK 17 & Aktifkan Cache Resmi Gradle
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 4. Prepare Client, Package.json, & Capacitor
      - name: Install Dependencies & Prepare Capacitor
        run: |
          cd BrillianceOrBlessed/client
          
          if [ ! -f package.json ]; then
            echo '{"name": "brilliance-client", "version": "1.0.0"}' > package.json
          fi

          mkdir -p www
          find . -maxdepth 3 -iname "index.html" -not -path "./www/*" -exec cp {} www/index.html \;

          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BrillianceOrBlessed" "com.brilliance.app" --web-dir www
          npx cap add android
          npx cap sync android

      # 5. Fix Jetifier & Upgrade Gradle ke Versi 8.7
      - name: Fix gradle.properties & Upgrade Gradle Wrapper
        run: |
          cd BrillianceOrBlessed/client/android
          
          # Fix deprecated Jetifier
          if [ -f "gradle.properties" ]; then
            sed -i 's/android.jetifier.blacklist/android.jetifier.ignorelist/g' gradle.properties
          fi
          
          # Paksa naik versi ke Gradle 8.7 untuk menghindari error Jar bcprov
          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-8.2.1-all.zip/gradle-8.7-all.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi

      # 6. Build APK Debug dengan Force Refresh
      - name: Build APK with Gradle
        run: |
          cd BrillianceOrBlessed/client/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --refresh-dependencies

      # 7. Upload hasil APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: BrillianceOrBlessed/client/android/app/build/outputs/apk/debug/app-debug.apk
