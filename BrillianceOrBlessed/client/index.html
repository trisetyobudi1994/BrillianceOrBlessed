<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brilliance or Blessed - Realtime Board Game</title>
  <script src="/socket.io/socket.io.js"></script>
  <!-- SDK Midtrans Snap (Sandbox) -->
  <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-YOUR_CLIENT_KEY"></script>
  
  <style>
    /* -------------------------------------------------- */
    /* THEME SYSTEM (Dark / Light Mode)                   */
    /* -------------------------------------------------- */
    :root[data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --border-color: #334155;
      --text-color: #f8fafc;
      --card-bg: #334155;
      --board-tile-1: #0284c7;
      --board-tile-2: #6366f1;
    }

    :root[data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-secondary: #ffffff;
      --border-color: #cbd5e1;
      --text-color: #0f172a;
      --card-bg: #e2e8f0;
      --board-tile-1: #38bdf8;
      --board-tile-2: #818cf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
    body { background: var(--bg-primary); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }

    /* Layout Utama */
    #sidebar { width: 340px; background: var(--bg-secondary); padding: 20px; display: flex; flex-direction: column; gap: 15px; border-right: 2px solid var(--border-color); }
    #game-container { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Controls Header */
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
    .theme-toggle-btn { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; cursor: pointer; }

    /* Form Login HP */
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group input { padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-color); }

    /* Buttons */
    .btn { background: #22c55e; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-pay { background: #f59e0b; width: 100%; margin-top: 5px; }

    /* Wheel Overlay Modal */
    #wheel-modal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: var(--bg-secondary); border: 3px solid #f59e0b; border-radius: 20px;
      padding: 25px; display: flex; flex-direction: column; align-items: center; gap: 15px;
      box-shadow: 0 0 40px rgba(0,0,0,0.5); display: none; z-index: 100;
    }
    .wheel-wrapper { position: relative; width: 240px; height: 240px; }
    #wheel-canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1); }
    .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #ef4444; z-index: 10; }
  </style>
</head>
<body>

  <!-- Sidebar Container -->
  <div id="sidebar">
    <div class="header-bar">
      <h3>Brilliance or Blessed</h3>
      <button class="theme-toggle-btn" onclick="toggleTheme()">☀️ / 🌙 Mode</button>
    </div>

    <!-- Pendaftaran / Login No HP -->
    <div id="auth-panel">
      <h4>Masuk / Daftar (No. HP)</h4>
      <div class="input-group" style="margin-top: 8px;">
        <input type="text" id="user-phone" placeholder="Contoh: 08123456789">
        <input type="text" id="user-name" placeholder="Nama Tampilan">
        <button class="btn" onclick="loginWithPhone()">Masuk Game</button>
      </div>
    </div>

    <hr style="border-color: var(--border-color);">

    <!-- Top Up Rekening Real / Payment Gateway -->
    <div>
      <h4>Beli Gold (Bank / QRIS / E-Wallet)</h4>
      <p style="font-size: 12px; color: #94a3b8;">Terhubung langsung ke pembayaran bank real-time.</p>
      <button class="btn btn-pay" onclick="buyGold(10000, 5000)">Beli 5,000 Gold - Rp 10.000</button>
    </div>

    <hr style="border-color: var(--border-color);">

    <h4>Status Pemain</h4>
    <div id="player-list"></div>
    <div id="turn-indicator" style="font-weight: bold; color: #f59e0b; margin-top: auto;"></div>
  </div>

  <!-- Game Canvas & Wheel -->
  <div id="game-container">
    <canvas id="board-canvas" width="700" height="500"></canvas>

    <div id="wheel-modal">
      <h3 style="color: #f59e0b;">Lucky Wheel Spin</h3>
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel-canvas" width="240" height="240"></canvas>
      </div>
      <button class="btn" id="btn-spin" onclick="spinWheel()">PUTAR RODA!</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let currentGameState = null;

    // ----------------------------------------------------
    // 1. TOGGLE DARK / LIGHT MODE
    // ----------------------------------------------------
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      renderBoard();
    }

    // ----------------------------------------------------
    // 2. AUTHENTICATION (NOMOR HP)
    // ----------------------------------------------------
    async function loginWithPhone() {
      const phone = document.getElementById('user-phone').value;
      const name = document.getElementById('user-name').value;

      if (!phone) return alert('Nomor HP wajib diisi!');

      const res = await fetch('/api/auth/phone', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, name })
      });

      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        alert(`Selamat datang, ${currentUser.name}!`);
        socket.emit('join_room', { roomId: 'room_main', phone: currentUser.phone });
      } else {
        alert(data.error);
      }
    }

    // ----------------------------------------------------
    // 3. PEMBAYARAN REAL-TIME (REKENING BANK / QRIS / SNAP)
    // ----------------------------------------------------
    async function buyGold(amountRupiah, goldAmount) {
      if (!currentUser) return alert('Silakan login dengan Nomor HP terlebih dahulu!');

      const res = await fetch('/api/payment/charge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentUser.phone, amount: amountRupiah, goldAmount })
      });

      const data = await res.json();
      if (data.success) {
        // Membuka Popup Pembayaran Real (BCA, Mandiri, BRI, QRIS, GoPay, dll)
        snap.pay(data.token, {
          onSuccess: function(result) { alert('Pembayaran Sukses! Gold ditambahkan.'); location.reload(); },
          onPending: function(result) { alert('Menunggu pembayaran Anda.'); },
          onError: function(result) { alert('Pembayaran gagal!'); }
        });
      }
    }

    // ----------------------------------------------------
    // 4. SOCKET & GAMEPLAY REALTIME
    // ----------------------------------------------------
    socket.on('room_state_update', (state) => {
      currentGameState = state;
      updateUI();
      renderBoard();
    });

    function updateUI() {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      if (!currentGameState) return;

      currentGameState.players.forEach(p => {
        const div = document.createElement('div');
        div.style.cssText = "padding:8px; margin-bottom:6px; border-radius:6px; background:var(--card-bg);";
        div.innerHTML = `<strong>${p.name}</strong> | Petak ${p.position} | 💰 ${p.gold}`;
        list.appendChild(div);
      });

      const modal = document.getElementById('wheel-modal');
      if (currentGameState.gameState === 'PLAYING' && currentGameState.currentTurn === socket.id) {
        modal.style.display = 'flex';
      } else {
        modal.style.display = 'none';
      }
    }

    function renderBoard() {
      const canvas = document.getElementById('board-canvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const computedStyle = getComputedStyle(document.documentElement);
      const tileColor1 = computedStyle.getPropertyValue('--board-tile-1').trim();
      const tileColor2 = computedStyle.getPropertyValue('--board-tile-2').trim();

      // Render Papan
      for (let i = 0; i < 30; i++) {
        const x = (i % 10) * 65 + 25;
        const y = Math.floor(i / 10) * 140 + 50;
        ctx.fillStyle = i % 2 === 0 ? tileColor1 : tileColor2;
        ctx.fillRect(x, y, 55, 50);
      }
    }

    function spinWheel() {
      socket.emit('req_spin_wheel');
    }

    socket.on('wheel_spun', (data) => {
      const wheelCanvas = document.getElementById('wheel-canvas');
      wheelCanvas.style.transform = `rotate(${1440 + (data.slotIndex * 60)}deg)`;
      setTimeout(() => {
        alert(`Dapat ${data.slotResult.label}!`);
        wheelCanvas.style.transform = 'rotate(0deg)';
      }, 4000);
    });
  </script>
</body>
</html>
